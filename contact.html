<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Sumit</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --ink: #f4f4f8;
    --muted: rgba(244, 244, 248, 0.62);
    --glass: rgba(255, 255, 255, 0.07);
    --edge: rgba(255, 255, 255, 0.16);
    --accent-a: #7f5af0;
    --accent-b: #2cb67d;
    --accent-c: #ff8906;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 100px 24px 48px;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #1b2735);
    background-size: 400% 400%;
    animation: drift 18s ease infinite;
    overflow-x: hidden;
  }

  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* soft colored glows behind the card */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    pointer-events: none;
    animation: float 14s ease-in-out infinite;
  }
  .orb.a { width: 340px; height: 340px; background: var(--accent-a); top: 8%;  left: 10%; }
  .orb.b { width: 300px; height: 300px; background: var(--accent-b); bottom: 6%; right: 12%; animation-delay: -5s; }
  .orb.c { width: 220px; height: 220px; background: var(--accent-c); top: 55%;  left: 55%; animation-delay: -9s; opacity: 0.3; }

  @keyframes float {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(30px, -40px, 0) scale(1.12); }
  }

  /* site navigation */
  nav.site {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--edge);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  nav.site a {
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    border-radius: 999px;
    transition: color 0.18s ease, background 0.18s ease;
  }
  nav.site a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
  nav.site a[aria-current="page"] { color: var(--ink); background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); }
  nav.site a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .card {
    position: relative;
    width: min(640px, 100%);
    margin: 0 auto;
    padding: clamp(28px, 6vw, 56px);
    text-align: center;
    border-radius: 28px;
    background: var(--glass);
    border: 1px solid var(--edge);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  .badge {
    display: inline-block;
    margin-bottom: 22px;
    padding: 7px 16px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
  }

  h1 {
    margin: 0;
    font-size: clamp(38px, 8vw, 64px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    background: linear-gradient(100deg, #ffffff 0%, var(--accent-a) 35%, var(--accent-c) 60%, #ffffff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }

  @keyframes shimmer {
    to { background-position: 220% center; }
  }

  p.lede {
    margin: 18px auto 32px;
    max-width: 42ch;
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.65;
    color: var(--muted);
  }

  form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    text-align: left;
  }
  .field { display: grid; gap: 7px; }
  .field.full { grid-column: 1 / -1; }
  label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid var(--edge);
    background: rgba(255, 255, 255, 0.05);
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  textarea { min-height: 140px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: rgba(244, 244, 248, 0.35); }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-a);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 4px rgba(127, 90, 240, 0.25);
  }

  .submit-row {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 6px;
  }

  .btn {
    display: inline-block;
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    padding: 14px 30px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 10px 26px rgba(127, 90, 240, 0.4);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .btn:hover  { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(127, 90, 240, 0.52); filter: brightness(1.07); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .status {
    grid-column: 1 / -1;
    min-height: 1.4em;
    text-align: center;
    font-size: 14px;
    color: var(--accent-b);
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 30px;
    text-align: left;
  }
  .tile {
    display: block;
    padding: 20px 22px;
    border-radius: 20px;
    color: inherit;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--edge);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .tile:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.09); }
  .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .tile .icon { font-size: 24px; }
  .tile h2 { margin: 10px 0 4px; font-size: 16px; }
  .tile p  { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }

  footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(244, 244, 248, 0.35);
  }

  @media (prefers-reduced-motion: reduce) {
    body, .orb, h1, .card { animation: none; }
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <nav class="site" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>

  <main class="card">
    <span class="badge">Contact</span>
    <h1>Get in touch</h1>
    <p class="lede">Have a question, an idea, or just want to say hi? Drop me a message and I'll get back to you.</p>

    <form id="contact-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field full">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
      </div>
      <div class="submit-row">
        <button class="btn" type="submit">Send message</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </form>

    <section class="tiles">
      <a class="tile" id="email-tile" href="#">
        <div class="icon">✉️</div>
        <h2>Email</h2>
        <p id="email-text"></p>
      </a>
      <a class="tile" href="about.html">
        <div class="icon">👋</div>
        <h2>More about me</h2>
        <p>Who I am and what I'm up to.</p>
      </a>
    </section>
  </main>

  <footer>Built in the Demo folder</footer>

<script>
  // Replace with the address you want messages sent to.
  const CONTACT_EMAIL = "you@example.com";

  const emailTile = document.getElementById("email-tile");
  emailTile.href = "mailto:" + CONTACT_EMAIL;
  document.getElementById("email-text").textContent = CONTACT_EMAIL;

  // No server here, so the form opens the visitor's email app with the message filled in.
  document.getElementById("contact-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const from = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();

    const subject = "Hello from " + name;
    const body = message + "\n\n— " + name + " (" + from + ")";
    window.location.href = "mailto:" + CONTACT_EMAIL +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);

    document.getElementById("status").textContent = "Opening your email app…";
  });
</script>
</body>
</html>
