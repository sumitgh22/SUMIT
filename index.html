<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, World</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --ink: #f4f4f8;
    --muted: rgba(244, 244, 248, 0.62);
    --glass: rgba(255, 255, 255, 0.07);
    --edge: rgba(255, 255, 255, 0.16);
    --accent-a: #7f5af0;
    --accent-b: #2cb67d;
    --accent-c: #ff8906;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 96px 24px 64px;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #1b2735);
    background-size: 400% 400%;
    animation: drift 18s ease infinite;
    overflow: hidden;
  }

  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* soft colored glows behind the card */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    pointer-events: none;
    animation: float 14s ease-in-out infinite;
  }
  .orb.a { width: 340px; height: 340px; background: var(--accent-a); top: 8%;  left: 10%; }
  .orb.b { width: 300px; height: 300px; background: var(--accent-b); bottom: 6%; right: 12%; animation-delay: -5s; }
  .orb.c { width: 220px; height: 220px; background: var(--accent-c); top: 55%;  left: 55%; animation-delay: -9s; opacity: 0.3; }

  @keyframes float {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(30px, -40px, 0) scale(1.12); }
  }

  /* site navigation */
  nav.site {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--edge);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  nav.site a {
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    border-radius: 999px;
    transition: color 0.18s ease, background 0.18s ease;
  }
  nav.site a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
  nav.site a[aria-current="page"] { color: var(--ink); background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); }
  nav.site a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .card {
    position: relative;
    width: min(560px, 100%);
    padding: clamp(32px, 6vw, 56px);
    text-align: center;
    border-radius: 28px;
    background: var(--glass);
    border: 1px solid var(--edge);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  .badge {
    display: inline-block;
    margin-bottom: 22px;
    padding: 7px 16px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
  }

  h1 {
    margin: 0;
    font-size: clamp(42px, 9vw, 76px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    background: linear-gradient(100deg, #ffffff 0%, var(--accent-a) 35%, var(--accent-c) 60%, #ffffff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }

  @keyframes shimmer {
    to { background-position: 220% center; }
  }

  p.lede {
    margin: 18px auto 30px;
    max-width: 38ch;
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.65;
    color: var(--muted);
  }

  .btn {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    padding: 14px 30px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 10px 26px rgba(127, 90, 240, 0.4);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .btn:hover  { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(127, 90, 240, 0.52); filter: brightness(1.07); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .greeting {
    margin-top: 22px;
    min-height: 1.4em;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--muted);
    transition: opacity 0.25s ease;
  }

  footer {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(244, 244, 248, 0.35);
  }

  @media (prefers-reduced-motion: reduce) {
    body, .orb, h1, .card { animation: none; }
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <nav class="site" aria-label="Main">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="card">
    <span class="badge">Demo</span>
    <h1>Hello, World</h1>
    <p class="lede">A small page with nice manners: animated gradients, frosted glass, and a button that says hi in a different language every time.</p>
    <button class="btn" id="hi">Say hello</button>
    <div class="greeting" id="out">&nbsp;</div>
  </main>

  <footer>Built in the Demo folder</footer>

<script>
  const greetings = [
    ["Hola",       "Spanish"],
    ["Bonjour",    "French"],
    ["नमस्ते",       "Hindi"],
    ["こんにちは",   "Japanese"],
    ["Ciao",       "Italian"],
    ["Hallo",      "German"],
    ["Olá",        "Portuguese"],
    ["Привет",     "Russian"],
    ["مرحبا",       "Arabic"],
    ["안녕하세요",   "Korean"],
    ["你好",        "Chinese"]
  ];

  const out = document.getElementById("out");
  let last = -1;

  document.getElementById("hi").addEventListener("click", () => {
    let i;
    do { i = Math.floor(Math.random() * greetings.length); } while (i === last && greetings.length > 1);
    last = i;

    const [word, lang] = greetings[i];
    out.style.opacity = 0;
    setTimeout(() => {
      out.textContent = word + "  —  " + lang;
      out.style.opacity = 1;
    }, 200);
  });
</script>
</body>
</html>
